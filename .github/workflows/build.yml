name: Build
on:
  push:
jobs:
  ################################################################################

  msvc-dynamic:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt (dynamically linked)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          setup-python: false

      - name: Build application
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          windeployqt build/Release/awscred.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: awscred_msvc-dynamic
          path: build/Release/

  msvc-static:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt (statically linked)
        uses: AllanChain/install-qt-static@v6.10.1-3

      - name: Build application
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: awscred_msvc-static
          path: build/Release/

  ################################################################################

  release:
    runs-on: ubuntu-latest
    needs:
      - msvc-dynamic
      - msvc-static
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Create release assets
        run: |
          (cd awscred_msvc-dynamic; zip -r ../awscred_msvc-dynamic.zip awscred)
          (cd awscred_msvc-static;  zip -r ../awscred_msvc-static.zip  awscred)

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "awscred_msvc-*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
