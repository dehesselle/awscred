name: Build
on:
  push:
jobs:
  ################################################################################

  msvc_dynamic:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt (dynamically linked)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.10.1
          setup-python: false

      - name: Build application
        run: |
          cmake -S . -B build
          cmake --build build --config Release
          windeployqt build/Release/awscred.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: awscred-msvc_dynamic
          path: build/Release/

  msvc_static:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Qt (statically linked)
        uses: AllanChain/install-qt-static@v6.10.1-3

      - name: Build application
        run: |
          cmake -S . -B build -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: awscred-msvc_static
          path: build/Release/

  ################################################################################

  release:
    runs-on: ubuntu-latest
    needs:
      - msvc_dynamic
      - msvc_static
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Create release assets
        run: |
          zip -r awscred-msvc_dynamic.zip awscred-msvc_dynamic
          zip -r awscred-msvc_static.zip  awscred-msvc_static

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "awscred-msvc_*.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: true
